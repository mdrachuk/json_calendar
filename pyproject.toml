[project]
name = "json-calendar"
version = "0.1.0"
description = "JSCalendar 2.0 for Python: pydantic models & validation, recurrence expansion, and iCalendar conversion"
readme = "README.md"
authors = [
    { name = "Mykhailo Drachuk", email = "m@drach.uk" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["jscalendar", "icalendar", "calendar", "rfc8984", "jscalendarbis", "recurrence"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/mdrachuk/json_calendar"
Repository = "https://github.com/mdrachuk/json_calendar"
Issues = "https://github.com/mdrachuk/json_calendar/issues"
Changelog = "https://github.com/mdrachuk/json_calendar/releases"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
    "ty",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ty.environment]
python-version = "3.11"
